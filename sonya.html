<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Соня</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0a0a0a;color:#fff;font-family:'Montserrat',sans-serif;overflow-x:hidden;cursor:none}

.cr{position:fixed;width:20px;height:20px;pointer-events:none;z-index:99999;transition:transform .1s}
.cr::before,.cr::after{content:'';position:absolute;width:12px;height:12px;background:#ff2d55;border-radius:50% 50% 0 0}
.cr::before{left:0;transform:rotate(-45deg);transform-origin:bottom right}
.cr::after{right:0;transform:rotate(45deg);transform-origin:bottom left}

.hearts{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.heart{position:absolute;bottom:-40px;animation:hf linear infinite;opacity:0}
.heart svg{width:var(--s);height:var(--s);fill:var(--c);filter:blur(var(--b,0px));opacity:var(--o)}
@keyframes hf{0%{transform:translateY(0) rotate(0deg) scale(1);opacity:0}10%{opacity:var(--o)}90%{opacity:var(--o)}100%{transform:translateY(-110vh) rotate(var(--r)) scale(var(--sc));opacity:0}}

.bg-g{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 50% 40% at 50% 50%,rgba(255,45,85,.04),transparent),
  radial-gradient(ellipse 40% 30% at 30% 70%,rgba(255,100,150,.02),transparent),
  radial-gradient(ellipse 40% 30% at 70% 30%,rgba(200,50,100,.02),transparent)}

.content{position:relative;z-index:10;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px}

.title{font-family:'Great Vibes',cursive;font-size:clamp(60px,15vw,160px);color:#ff2d55;text-shadow:0 0 60px rgba(255,45,85,.3),0 0 120px rgba(255,45,85,.1);margin-bottom:16px;animation:tg 3s ease-in-out infinite alternate;position:relative}
@keyframes tg{0%{text-shadow:0 0 60px rgba(255,45,85,.3),0 0 120px rgba(255,45,85,.1);transform:scale(1)}100%{text-shadow:0 0 80px rgba(255,45,85,.5),0 0 160px rgba(255,45,85,.2);transform:scale(1.02)}}

.sub{font-size:clamp(12px,2vw,18px);color:rgba(255,255,255,.35);letter-spacing:8px;text-transform:uppercase;margin-bottom:60px;animation:fi 2s .5s both}
@keyframes fi{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

.cards{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;max-width:700px;margin-bottom:60px}
.card{background:rgba(255,255,255,.02);border:1px solid rgba(255,45,85,.1);border-radius:16px;padding:28px 32px;text-align:center;backdrop-filter:blur(10px);transition:all .4s cubic-bezier(.16,1,.3,1);cursor:pointer;animation:fi .6s calc(.8s + var(--i)*.1s) both}
.card:hover{border-color:rgba(255,45,85,.3);transform:translateY(-4px);box-shadow:0 12px 40px rgba(255,45,85,.08)}
.card .em{font-size:28px;margin-bottom:8px}
.card .tx{font-size:11px;color:rgba(255,255,255,.4);line-height:1.6}

.msg{font-size:clamp(14px,2.5vw,20px);color:rgba(255,255,255,.25);max-width:500px;text-align:center;line-height:1.9;font-weight:300;animation:fi 1s 1.2s both}

.float{position:fixed;z-index:5;pointer-events:none;animation:fl 6s ease-in-out infinite alternate}
@keyframes fl{0%{transform:translateY(0) rotate(0deg)}100%{transform:translateY(-20px) rotate(5deg)}}

.particles{position:fixed;inset:0;z-index:1;pointer-events:none}
.p{position:absolute;width:2px;height:2px;background:rgba(255,45,85,.3);border-radius:50%;animation:pf linear infinite}
@keyframes pf{0%{transform:translateY(100vh) scale(0);opacity:0}50%{opacity:1}100%{transform:translateY(-10vh) scale(1);opacity:0}}

.pulse{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:10;display:flex;flex-direction:column;align-items:center;gap:8px;animation:fi 1.5s 2s both}
.pulse span{font-size:9px;color:rgba(255,255,255,.2);letter-spacing:4px;text-transform:uppercase}
.pulse .h{width:1px;height:30px;background:linear-gradient(to bottom,rgba(255,45,85,.3),transparent);animation:ph 2s ease-in-out infinite}
@keyframes ph{0%,100%{opacity:.3;transform:scaleY(1)}50%{opacity:.8;transform:scaleY(1.3)}}

@media(max-width:600px){.cards{gap:12px}.card{padding:20px 24px}}
</style>
</head>
<body>

<div class="cr" id="cursor"></div>
<div class="bg-g"></div>
<div class="hearts" id="hearts"></div>
<div class="particles" id="particles"></div>

<div class="content">
  <div class="title">Соня</div>
  <div class="sub">моя любимая</div>
  
  <div class="cards">
    <div class="card" style="--i:0"><div class="em">❤️</div><div class="tx">Ты мое счастье</div></div>
    <div class="card" style="--i:1"><div class="em">✨</div><div class="tx">Ты моя звезда</div></div>
    <div class="card" style="--i:2"><div class="em">🌸</div><div class="tx">Ты моя весна</div></div>
  </div>

  <div class="msg">Каждый день с тобой — лучший день в моей жизни. Спасибо, что ты есть.</div>
</div>

<div class="pulse">
  <span>навсегда</span>
  <div class="h"></div>
</div>

<script>
const cur=document.getElementById('cursor');
let mx=0,my=0,cx=0,cy=0;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY});
(function anim(){cx+=(mx-cx)*.15;cy+=(my-cy)*.15;cur.style.left=cx+'px';cur.style.top=cy+'px';requestAnimationFrame(anim)})();

const h=document.getElementById('hearts');
function mkHeart(){
  const d=document.createElement('div');d.className='heart';
  const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 24 24');
  const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d','M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z');
  s.appendChild(p);d.appendChild(s);
  const sz=10+Math.random()*20;d.style.setProperty('--s',sz+'px');
  d.style.left=Math.random()*100+'%';
  d.style.setProperty('--r',(Math.random()*60-30)+'deg');
  d.style.setProperty('--sc',(.5+Math.random()*.5));
  const cols=['#ff2d55','#ff6b8a','#ff8fa3','#e84057','#ff1744','#ff5c8d'];
  d.style.setProperty('--c',cols[Math.floor(Math.random()*cols.length)]);
  d.style.setProperty('--o',(.15+Math.random()*.35));
  d.style.setProperty('--b',(Math.random()>.7?Math.random()*2+'px':'0px'));
  d.style.animationDuration=(8+Math.random()*12)+'s';
  h.appendChild(d);setTimeout(()=>d.remove(),20000);
}
setInterval(mkHeart,400);
for(let i=0;i<8;i++)setTimeout(mkHeart,i*200);

const p=document.getElementById('particles');
for(let i=0;i<30;i++){
  const d=document.createElement('div');d.className='p';
  d.style.left=Math.random()*100+'%';
  d.style.animationDuration=(4+Math.random()*8)+'s';
  d.style.animationDelay=Math.random()*8+'s';
  d.style.width=d.style.height=(1+Math.random()*2)+'px';
  p.appendChild(d);
}
</script>
</body>
</html>
